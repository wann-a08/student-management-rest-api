<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Siswa</title>

    <style>
        :root {
            --bg: #0B0F1A;
            --panel: #121826;
            --panel-border: #232C40;
            --text: #E4E9F2;
            --text-dim: #7C8AA5;
            --accent: #7C5CFF;
            --accent-2: #22D3EE;
            --accent-soft: rgba(124, 92, 255, 0.12);
            --ok: #34D399;
            --ok-bg: rgba(52, 211, 153, 0.12);
            --danger: #F87171;
            --danger-bg: rgba(248, 113, 113, 0.12);
            --warn: #FBBF24;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, "Segoe UI", Inter, Arial, sans-serif;
            background:
                radial-gradient(circle at 15% 0%, rgba(124,92,255,0.08), transparent 40%),
                radial-gradient(circle at 85% 20%, rgba(34,211,238,0.06), transparent 40%),
                var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        .container {
            width: 92%;
            max-width: 1000px;
            margin: 48px auto;
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 4px;
        }

        .subtitle {
            color: var(--text-dim);
            font-size: 14px;
            margin-bottom: 28px;
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--panel-border);
            padding: 24px;
            border-radius: 12px;
            margin-bottom: 24px;
        }

        .card h2 {
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card h2::before {
            content: "";
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent-2);
            box-shadow: 0 0 8px var(--accent-2);
        }

        .message {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
            border: 1px solid transparent;
        }

        .success { background: var(--ok-bg); color: var(--ok); border-color: rgba(52,211,153,0.3); }
        .error { background: var(--danger-bg); color: var(--danger); border-color: rgba(248,113,113,0.3); }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group.full { grid-column: span 2; }

        label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-dim);
        }

        input {
            padding: 11px 12px;
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            font-size: 14px;
            background: #0E1421;
            color: var(--text);
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        input::placeholder { color: #4B5670; }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        button {
            border: none;
            padding: 11px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: filter 0.15s, transform 0.1s;
        }

        button:hover { filter: brightness(1.12); }
        button:active { transform: scale(0.98); }

        .btn-primary { background: var(--accent); color: white; }
        .btn-edit { background: var(--warn); color: #1a1400; }
        .btn-delete { background: var(--danger); color: white; }
        .btn-cancel { background: transparent; color: var(--text-dim); border: 1px solid var(--panel-border); }

        .actions { display: flex; gap: 8px; }

        .form-buttons {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 6px;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid var(--panel-border);
            text-align: left;
            font-size: 14px;
        }

        th {
            color: var(--text-dim);
            font-size: 12px;
            font-weight: 600;
        }

        td.mono, th.mono { font-family: "SF Mono", Consolas, monospace; }

        tbody tr:hover { background: rgba(124, 92, 255, 0.04); }

        .loading {
            text-align: center;
            padding: 20px;
            color: var(--text-dim);
            display: none;
        }

        @media (max-width: 700px) {
            .form-grid { grid-template-columns: 1fr; }
            .form-group.full { grid-column: span 1; }
            table { font-size: 13px; }
            .actions { flex-direction: column; }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Data Siswa</h1>
    <p class="subtitle">Kelola data siswa</p>

    <div id="successMessage" class="message success"></div>
    <div id="errorMessage" class="message error"></div>

    <div class="card">
        <h2 id="formTitle">Tambah Siswa</h2>

        <form id="siswaForm">
            <input type="hidden" id="siswaId">

            <div class="form-grid">
                <div class="form-group">
                    <label for="nis">NIS</label>
                    <input type="number" id="nis" placeholder="Masukkan NIS" required>
                </div>

                <div class="form-group">
                    <label for="nama">Nama</label>
                    <input type="text" id="nama" placeholder="Masukkan nama" required>
                </div>

                <div class="form-group">
                    <label for="kelas">Kelas</label>
                    <input type="text" id="kelas" placeholder="Contoh: XI RPL" required>
                </div>

                <div class="form-group">
                    <label for="alamat">Alamat</label>
                    <input type="text" id="alamat" placeholder="Masukkan alamat" required>
                </div>
            </div>

            <div class="form-buttons">
                <button type="submit" class="btn-primary" id="submitButton">Tambah Siswa</button>
                <button type="button" class="btn-cancel" id="cancelButton" style="display: none;">Batal</button>
            </div>
        </form>
    </div>

    <div class="card">
        <h2>Daftar Siswa</h2>

        <div id="loading" class="loading">Mengambil data siswa...</div>

        <table>
            <thead>
                <tr>
                    <th class="mono">ID</th>
                    <th class="mono">NIS</th>
                    <th>Nama</th>
                    <th>Kelas</th>
                    <th>Alamat</th>
                    <th>Aksi</th>
                </tr>
            </thead>
            <tbody id="siswaTable"></tbody>
        </table>
    </div>

</div>

<script src="/js/siswa.js"></script>

</body>
</html>
