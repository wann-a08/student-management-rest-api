<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Siswa</title>

    <style>
        :root {
            --bg: #0B0F1A;
            --panel: #121826;
            --panel-border: #232C40;
            --text: #E4E9F2;
            --text-dim: #7C8AA5;
            --accent: #7C5CFF;
            --accent-2: #22D3EE;
            --accent-soft: rgba(124, 92, 255, 0.12);
            --ok: #34D399;
            --ok-bg: rgba(52, 211, 153, 0.12);
            --danger: #F87171;
            --danger-bg: rgba(248, 113, 113, 0.12);
            --warn: #FBBF24;
        }

        :root[data-theme="light"] {
            --bg: #F3F5FA;
            --panel: #FFFFFF;
            --panel-border: #E1E6F0;
            --text: #131A2B;
            --text-dim: #667085;
            --accent: #6D4FEA;
            --accent-2: #0E8FA8;
            --accent-soft: rgba(109, 79, 234, 0.10);
            --ok: #10875B;
            --ok-bg: rgba(16, 135, 91, 0.10);
            --danger: #D3392E;
            --danger-bg: rgba(211, 57, 46, 0.10);
            --warn: #B5720A;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, "Segoe UI", Inter, Arial, sans-serif;
            transition: background 0.2s ease, color 0.2s ease;
            background:
                radial-gradient(circle at 15% 0%, rgba(124,92,255,0.08), transparent 40%),
                radial-gradient(circle at 85% 20%, rgba(34,211,238,0.06), transparent 40%),
                var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        .container {
            width: 92%;
            max-width: 1000px;
            margin: 48px auto;
        }

        .page-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 28px;
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 4px;
        }

        .subtitle {
            color: var(--text-dim);
            font-size: 14px;
        }

        .theme-toggle {
            background: var(--panel);
            border: 1px solid var(--panel-border);
            color: var(--text);
            width: 40px;
            height: 40px;
            border-radius: 8px;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .theme-toggle:hover { border-color: var(--accent); }

        .card {
            background: var(--panel);
            border: 1px solid var(--panel-border);
            padding: 24px;
            border-radius: 12px;
            margin-bottom: 24px;
        }

        .card h2 {
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card h2::before {
            content: "";
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent-2);
            box-shadow: 0 0 8px var(--accent-2);
        }

        .message {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
            border: 1px solid transparent;
        }

        .success { background: var(--ok-bg); color: var(--ok); border-color: rgba(52,211,153,0.3); }
        .error { background: var(--danger-bg); color: var(--danger); border-color: rgba(248,113,113,0.3); }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group.full { grid-column: span 2; }

        label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-dim);
        }

        input {
            padding: 11px 12px;
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            font-size: 14px;
            background: #0E1421;
            color: var(--text);
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        input::placeholder { color: #4B5670; }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        input.invalid {
            border-color: var(--danger);
        }

        input.invalid:focus {
            box-shadow: 0 0 0 3px var(--danger-bg);
        }

        .field-error {
            font-size: 12px;
            color: var(--danger);
            min-height: 15px;
            display: none;
        }

        .field-error.show { display: block; }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        button {
            border: none;
            padding: 11px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: filter 0.15s, transform 0.1s;
        }

        button:hover { filter: brightness(1.12); }
        button:active { transform: scale(0.98); }

        .btn-primary { background: var(--accent); color: white; }
        .btn-edit { background: var(--warn); color: #1a1400; }
        .btn-delete { background: var(--danger); color: white; }
        .btn-cancel { background: transparent; color: var(--text-dim); border: 1px solid var(--panel-border); }

        .actions { display: flex; gap: 8px; }

        .form-buttons {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 6px;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid var(--panel-border);
            text-align: left;
            font-size: 14px;
        }

        th {
            color: var(--text-dim);
            font-size: 12px;
            font-weight: 600;
        }

        td.mono, th.mono { font-family: "SF Mono", Consolas, monospace; }

        tbody tr:hover { background: rgba(124, 92, 255, 0.04); }

        .loading {
            text-align: center;
            padding: 20px;
            color: var(--text-dim);
            display: none;
        }

        .toolbar {
            display: flex;
            gap: 12px;
            margin-bottom: 18px;
        }

        .toolbar input,
        .toolbar select {
            padding: 10px 12px;
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            font-size: 14px;
            background: #0E1421;
            color: var(--text);
            outline: none;
        }

        :root[data-theme="light"] .toolbar input,
        :root[data-theme="light"] .toolbar select {
            background: #F8FAFC;
        }

        .toolbar input:focus,
        .toolbar select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        .toolbar .search-field { flex: 1; }
        .toolbar .kelas-field { width: 160px; flex-shrink: 0; }

        .empty-state {
            text-align: center;
            padding: 28px 12px;
            color: var(--text-dim);
            font-size: 14px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            object-fit: cover;
            border: 1px solid var(--panel-border);
            display: block;
        }

        .avatar-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--accent-soft);
            color: var(--accent);
            font-weight: 700;
            font-size: 14px;
        }

        input[type="file"] {
            padding: 8px;
            font-size: 13px;
            color: var(--text-dim);
        }

        .foto-preview-wrap { margin-top: 10px; }

        .foto-preview {
            width: 72px;
            height: 72px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid var(--panel-border);
            display: block;
        }

        .pagination {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 16px;
        }

        .pagination-info {
            font-size: 13px;
            color: var(--text-dim);
        }

        .pagination button {
            background: var(--panel);
            border: 1px solid var(--panel-border);
            color: var(--text);
            padding: 7px 14px;
            font-weight: 500;
        }

        .pagination button:not(:disabled):hover { border-color: var(--accent); }

        @media (max-width: 700px) {
            .toolbar { flex-direction: column; }
            .toolbar .kelas-field { width: 100%; }
        }

        @media (max-width: 700px) {
            .form-grid { grid-template-columns: 1fr; }
            .form-group.full { grid-column: span 1; }
            table { font-size: 13px; }
            .actions { flex-direction: column; }
        }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(5, 7, 13, 0.7);
            backdrop-filter: blur(2px);
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal-box {
            background: var(--panel);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            width: 360px;
            max-width: 90%;
            padding: 24px;
            box-shadow: 0 0 0 1px rgba(248,113,113,0.15), 0 20px 50px rgba(0,0,0,0.5);
        }

        .modal-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: var(--danger-bg);
            color: var(--danger);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            margin-bottom: 16px;
        }

        .modal-box h3 {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .modal-box p {
            font-size: 14px;
            color: var(--text-dim);
            line-height: 1.5;
            margin-bottom: 22px;
        }

        .modal-box p strong {
            color: var(--text);
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="page-header">
        <div>
            <h1>Data Siswa</h1>
            <p class="subtitle">Kelola data siswa</p>
        </div>
        <button type="button" class="theme-toggle" id="themeToggle" aria-label="Ganti tema terang/gelap">🌙</button>
    </div>

    <div id="successMessage" class="message success"></div>
    <div id="errorMessage" class="message error"></div>

    <div class="card">
        <h2 id="formTitle">Tambah Siswa</h2>

        <form id="siswaForm" novalidate>
            <input type="hidden" id="siswaId">

            <div class="form-grid">
                <div class="form-group">
                    <label for="nis">NIS</label>
                    <input type="number" id="nis" placeholder="Masukkan NIS" required>
                    <span class="field-error" id="nisError"></span>
                </div>

                <div class="form-group">
                    <label for="nama">Nama</label>
                    <input type="text" id="nama" placeholder="Masukkan nama" required>
                    <span class="field-error" id="namaError"></span>
                </div>

                <div class="form-group">
                    <label for="kelas">Kelas</label>
                    <input type="text" id="kelas" placeholder="Contoh: XI RPL" required>
                    <span class="field-error" id="kelasError"></span>
                </div>

                <div class="form-group">
                    <label for="alamat">Alamat</label>
                    <input type="text" id="alamat" placeholder="Masukkan alamat" required>
                    <span class="field-error" id="alamatError"></span>
                </div>

                <div class="form-group full">
                    <label for="foto">Foto Siswa (opsional)</label>
                    <input type="file" id="foto" accept="image/png, image/jpeg, image/webp">
                    <span class="field-error" id="fotoError"></span>
                    <div class="foto-preview-wrap" id="fotoPreviewWrap" style="display:none;">
                        <img id="fotoPreview" class="foto-preview" alt="Preview foto siswa">
                    </div>
                </div>
            </div>

            <div class="form-buttons">
                <button type="submit" class="btn-primary" id="submitButton">Tambah Siswa</button>
                <button type="button" class="btn-cancel" id="cancelButton" style="display: none;">Batal</button>
            </div>
        </form>
    </div>

    <div class="card">
        <h2>Daftar Siswa</h2>

        <div class="toolbar">
            <div class="search-field">
                <input type="text" id="searchInput" placeholder="Cari nama, NIS, atau alamat...">
            </div>
            <div class="kelas-field">
                <select id="kelasFilter">
                    <option value="">Semua Kelas</option>
                </select>
            </div>
        </div>

        <div id="loading" class="loading">Mengambil data siswa...</div>

        <table>
            <thead>
                <tr>
                    <th>Foto</th>
                    <th class="mono">ID</th>
                    <th class="mono">NIS</th>
                    <th>Nama</th>
                    <th>Kelas</th>
                    <th>Alamat</th>
                    <th>Aksi</th>
                </tr>
            </thead>
            <tbody id="siswaTable"></tbody>
        </table>

        <div class="pagination" id="pagination">
            <span class="pagination-info" id="paginationInfo"></span>
            <button type="button" id="prevPageBtn">Sebelumnya</button>
            <button type="button" id="nextPageBtn">Berikutnya</button>
        </div>
    </div>

</div>

<div class="modal-overlay" id="confirmModal">
    <div class="modal-box">
        <div class="modal-icon">!</div>
        <h3>Hapus data siswa?</h3>
        <p id="confirmModalText">Data yang dihapus tidak bisa dikembalikan.</p>
        <div class="modal-buttons">
            <button type="button" class="btn-cancel" id="confirmCancelBtn">Batal</button>
            <button type="button" class="btn-delete" id="confirmDeleteBtn">Hapus</button>
        </div>
    </div>
</div>

<script src="/js/siswa.js"></script>

</body>
</html>
